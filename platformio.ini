; Rrptr build configuration
;
; Shared settings live here; each board's env is in variants/<board>/platformio.ini.

[platformio]
default_envs = promicro_sx1262
extra_configs =
	variants/*/platformio.ini
	platformio.local*.ini       ; optional, git-ignored: per-machine overrides

; Settings common to every board
[rrptr]
version = 0.1.0
build_unflags =
	-std=gnu++11
	-fno-exceptions
	-fno-rtti
build_flags =
	-std=gnu++17
	-fexceptions                ; microReticulum uses C++ exceptions
	-Wall                       ; the nRF52 core adds it anyway, so libraries warn too
	-Wno-missing-field-initializers
	-Wno-format
	-Isrc
	-DNDEBUG
	-DMSGPACK_USE_BOOST=OFF
	-DRNS_USE_FS
	-DRNS_USE_PROVISIONING           ; settings engine (CLI and remote /provision)
	-DRNS_ENABLE_REMOTE_PROVISIONING
	-DRNS_LOG_LEVEL=RNS_LOG_LEVEL_INFO
	${local.build_flags}
	; RadioLib: only the LoRa chips Rrptr supports
	-DRADIOLIB_EXCLUDE_CC1101=1
	-DRADIOLIB_EXCLUDE_NRF24=1
	-DRADIOLIB_EXCLUDE_RF69=1
	-DRADIOLIB_EXCLUDE_SX1231=1
	-DRADIOLIB_EXCLUDE_SI443X=1
	-DRADIOLIB_EXCLUDE_RFM2X=1
	-DRADIOLIB_EXCLUDE_SX127X=1
	-DRADIOLIB_EXCLUDE_AFSK=1
	-DRADIOLIB_EXCLUDE_AX25=1
	-DRADIOLIB_EXCLUDE_HELLSCHREIBER=1
	-DRADIOLIB_EXCLUDE_MORSE=1
	-DRADIOLIB_EXCLUDE_APRS=1
	-DRADIOLIB_EXCLUDE_BELL=1
	-DRADIOLIB_EXCLUDE_RTTY=1
	-DRADIOLIB_EXCLUDE_SSTV=1
	-DRADIOLIB_EXCLUDE_PAGER=1
	-DRADIOLIB_EXCLUDE_FSK4=1
	-DRADIOLIB_EXCLUDE_LORAWAN=1
lib_deps =
	bblanchon/ArduinoJson@7.4.2
	hideakitai/MsgPack@0.4.2
	https://github.com/attermann/Crypto.git#984dc891330986c302a86c4e312d4f5abcc28359
	https://github.com/attermann/microStore.git#0f28567fe00ab8ab14624a34c2e9e0a000a44c46
	https://github.com/attermann/microReticulum.git#40fa628809d57140180c1c833559ab96fec992c1
	jgromes/RadioLib@7.8.1
extra_scripts =
	pre:scripts/version.py
	pre:scripts/cxx_flags.py   ; -frtti, -fno-use-cxa-atexit

; Per-machine build flags, e.g. default radio settings for a blank node.
; Override in platformio.local.ini (git-ignored):
;   [local]
;   build_flags = -DRRPTR_DEFAULT_FREQ_HZ=925875000 -DRRPTR_DEFAULT_BW_HZ=250000
[local]
build_flags =

; nRF52840 boards: Adafruit core, as microReticulum_Firmware uses
[nrf52_base]
platform = nordicnrf52@10.9.0
framework = arduino
monitor_speed = 115200
build_unflags =
	${rrptr.build_unflags}
	--specs=nano.specs          ; exceptions need the full newlib
	-Og
build_flags =
	${rrptr.build_flags}
	--specs=nosys.specs
	-Os
	-fno-inline-functions       ; these two save about 170 KB of flash
	-fno-inline-small-functions
	-fmerge-all-constants
	-DRRPTR_MCU_NRF52
lib_deps =
	${rrptr.lib_deps}
extra_scripts =
	${rrptr.extra_scripts}

; ESP32 boards: Arduino core 2.x, as MeshCore uses
[esp32_base]
platform = espressif32@6.11.0
framework = arduino
monitor_speed = 115200
build_unflags =
	${rrptr.build_unflags}
build_flags =
	${rrptr.build_flags}
	-Os
	-DRRPTR_MCU_ESP32
lib_deps =
	${rrptr.lib_deps}
extra_scripts =
	${rrptr.extra_scripts}
