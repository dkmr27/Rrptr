; Heltec WiFi LoRa 32 V4 (ESP32-S3, 16 MB flash, 2 MB PSRAM). The 8 MB layout is
; enough, and leaves the rest of the flash unused.
[env:heltec_v4_sx1262]
extends = esp32_base
extra_scripts =
	${esp32_base.extra_scripts}
	post:scripts/merged_image.py
custom_updater_env = heltec_v4_updater
custom_updater_offset = 0x1B0000
board = heltec_v4
board_build.partitions = boards/partitions/esp32s3_8mb_ota.csv
board_build.filesystem = littlefs
build_flags =
	${esp32_base.build_flags}
	-Ivariants/heltec_v4_sx1262
	-DUSTORE_USE_POSIXFS                 ; LittleFS through POSIX calls
	-DURTN_PATH_TABLE_MAX_RECS=500
	-DRNS_PATH_TABLE_SEGMENT_SIZE=24576
	-DRNS_PATH_TABLE_SEGMENT_COUNT=8
lib_deps =
	${esp32_base.lib_deps}
	adafruit/Adafruit GFX Library@1.11.11
	adafruit/Adafruit SSD1306@2.5.13

; The OTA updater, an app of its own. Flash it once over USB, into the second slot
; (0x1B0000), so it needs its own upload command; a normal upload would overwrite
; Rrptr in the first:
;   pio run -e heltec_v4_updater -t upload --upload-port <port>
[env:heltec_v4_updater]
platform = espressif32@6.11.0
framework = arduino
board = heltec_v4
board_build.partitions = boards/partitions/esp32s3_8mb_ota.csv
build_src_filter = -<*> +<../updater/>
build_flags =
	-Ivariants/heltec_v4_sx1262
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_PACKAGES_DIR/tool-esptoolpy/esptool.py" --chip esp32s3 --port "$UPLOAD_PORT" --baud 921600 write_flash 0x1B0000 "$SOURCE"
