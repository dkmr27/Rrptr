; Ebyte EoRa-HUB-900TB (ESP32-S3, 4 MB flash, 2 MB PSRAM, LR1121)
[env:ebyte_eora_hub_lr1121]
extends = esp32_base
extra_scripts =
	${esp32_base.extra_scripts}
	post:scripts/merged_image.py
custom_updater_env = ebyte_eora_hub_updater
custom_updater_offset = 0x1B0000
board = ebyte_eora_hub
board_build.partitions = boards/partitions/esp32s3_4mb_ota.csv
board_build.filesystem = littlefs
; The USB serial chip's DTR and RTS reset the board, so a terminal must leave them off
monitor_dtr = 0
monitor_rts = 0
build_flags =
	${esp32_base.build_flags}
	-Ivariants/ebyte_eora_hub_lr1121
	-DARDUINO_USB_CDC_ON_BOOT=1          ; as other ESP32-S3 boards: Serial1 is the UART console
	-DUSTORE_USE_POSIXFS                 ; LittleFS through POSIX calls
	-DURTN_PATH_TABLE_MAX_RECS=500
	-DRNS_PATH_TABLE_SEGMENT_SIZE=24576
	-DRNS_PATH_TABLE_SEGMENT_COUNT=8
lib_deps =
	${esp32_base.lib_deps}
	adafruit/Adafruit GFX Library@1.11.11
	adafruit/Adafruit SSD1306@2.5.13

; The OTA updater, an app of its own. Flash it once over USB, into the second slot
; (0x1B0000), so it needs its own upload command; a normal upload would overwrite
; Rrptr in the first:
;   pio run -e ebyte_eora_hub_updater -t upload --upload-port <port>
[env:ebyte_eora_hub_updater]
platform = espressif32@6.11.0
framework = arduino
board = ebyte_eora_hub
board_build.partitions = boards/partitions/esp32s3_4mb_ota.csv
build_src_filter = -<*> +<../updater/>
build_flags =
	-Ivariants/ebyte_eora_hub_lr1121
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_PACKAGES_DIR/tool-esptoolpy/esptool.py" --chip esp32s3 --port "$UPLOAD_PORT" --baud 460800 write_flash 0x1B0000 "$SOURCE"
