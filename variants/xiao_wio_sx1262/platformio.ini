; Seeed XIAO nRF52840 + Wio-SX1262 kit
[env:xiao_wio_sx1262]
extends = nrf52_base
board = seeed_xiao_nrf52840
board_build.filesystem = littlefs
; The bootloader has S140 v7.3.0: the app starts at 0x27000 and the DFU package
; carries that SoftDevice's id (sd_fwid in the board file). The board file's
; sd_version stays 6.1.1 because it only selects API headers, the core has no
; others and Rrptr does not use the SoftDevice.
board_build.ldscript = boards/nrf52840_s140_v7.ld
build_flags =
	${nrf52_base.build_flags}
	-Ivariants/xiao_wio_sx1262
	-DUSTORE_USE_FLASHFS                 ; P25Q16H
	-DRNS_CONTAINER_ALLOCATOR=RNS_HEAP_POOL_ALLOCATOR
	-DRNS_HEAP_POOL_BUFFER_SIZE=131072
	; Small path table defaults; raised at boot once the flash mounts
	-DURTN_PATH_TABLE_MAX_RECS=25
	-DRNS_PATH_TABLE_SEGMENT_SIZE=2048
	-DRNS_PATH_TABLE_SEGMENT_COUNT=6
lib_deps =
	${nrf52_base.lib_deps}
	adafruit/SdFat - Adafruit Fork@2.3.103
	https://github.com/attermann/Adafruit_SPIFlash.git#d73ef4a3938b906a0a312fae159ed0d93733a1d8  ; littlefs branch
