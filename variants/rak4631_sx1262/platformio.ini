; RAK4631 WisBlock core with a RAK15001 flash module. Not yet tested on hardware.
[env:rak4631_sx1262]
extends = nrf52_base
board = rak4631
board_build.filesystem = littlefs
build_flags =
	${nrf52_base.build_flags}
	-Ivariants/rak4631_sx1262
	-DCONFIG_NFCT_PINS_AS_GPIOS          ; P0.09/P0.10 (NFC pins) are WisBlock IO5/IO6
	-DUSTORE_USE_FLASHFS                 ; RAK15001
	-DRNS_CONTAINER_ALLOCATOR=RNS_HEAP_POOL_ALLOCATOR
	-DRNS_HEAP_POOL_BUFFER_SIZE=163840
lib_deps =
	${nrf52_base.lib_deps}
	adafruit/SdFat - Adafruit Fork@2.3.103
	https://github.com/attermann/Adafruit_SPIFlash.git#d73ef4a3938b906a0a312fae159ed0d93733a1d8  ; littlefs branch
