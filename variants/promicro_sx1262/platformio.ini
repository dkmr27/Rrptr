; Promicro-SX1262 ("FakeTec"): ProMicro / nice!nano nRF52840 with an SX1262 module
[env:promicro_sx1262]
extends = nrf52_base
board = promicro_nrf52840
board_build.filesystem = littlefs
build_flags =
	${nrf52_base.build_flags}
	-Ivariants/promicro_sx1262
	-DCONFIG_NFCT_PINS_AS_GPIOS          ; P0.09/P0.10 (NFC pins) are SX1262 RESET/DIO1
	-DUSTORE_USE_INTERNALFS
	-DRNS_CONTAINER_ALLOCATOR=RNS_HEAP_POOL_ALLOCATOR
	-DRNS_HEAP_POOL_BUFFER_SIZE=131072
	-DURTN_PATH_TABLE_MAX_RECS=25
	-DRNS_PATH_TABLE_SEGMENT_SIZE=2048
	-DRNS_PATH_TABLE_SEGMENT_COUNT=6
