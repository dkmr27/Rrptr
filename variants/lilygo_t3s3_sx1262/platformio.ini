; LilyGO T3S3 V1.2 with SX1262 (ESP32-S3)
[env:lilygo_t3s3_sx1262]
extends = esp32_base
board = lilygo-t3-s3
board_build.partitions = boards/partitions/esp32s3_4mb_ota.csv
board_build.filesystem = littlefs
build_flags =
	${esp32_base.build_flags}
	-Ivariants/lilygo_t3s3_sx1262
	-DUSTORE_USE_POSIXFS                 ; LittleFS through POSIX calls
	-DURTN_PATH_TABLE_MAX_RECS=500
	-DRNS_PATH_TABLE_SEGMENT_SIZE=24576
	-DRNS_PATH_TABLE_SEGMENT_COUNT=8
lib_deps =
	${esp32_base.lib_deps}
	adafruit/Adafruit GFX Library@1.11.11
	adafruit/Adafruit SSD1306@2.5.13

; The OTA updater, an app of its own. Flash it once over USB, into the second slot
; (0x1B0000), so it needs its own upload command; a normal upload would overwrite
; Rrptr in the first:
;   pio run -e lilygo_t3s3_updater -t upload --upload-port <port>
[env:lilygo_t3s3_updater]
platform = espressif32@6.11.0
framework = arduino
board = lilygo-t3-s3
board_build.partitions = boards/partitions/esp32s3_4mb_ota.csv
build_src_filter = -<*> +<../updater/>
build_flags =
	-Ivariants/lilygo_t3s3_sx1262
upload_protocol = custom
upload_command = "$PYTHONEXE" "$PROJECT_PACKAGES_DIR/tool-esptoolpy/esptool.py" --chip esp32s3 --port "$UPLOAD_PORT" --baud 921600 write_flash 0x1B0000 "$SOURCE"
